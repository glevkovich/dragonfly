name: Build Dragonfly
description: "Build Dragonfly with configurable CMake options"

inputs:
  build-type:
    description: "CMake build type (Debug or Release)"
    required: false
    default: 'Debug'
    type: string
  build-dir:
    description: "Build directory name (relative to workspace root)"
    required: false
    default: 'build'
    type: string
  c-compiler:
    description: "C compiler to use. Leave unset only if the container default is intended"
    required: false
    default: 'unknwn_c_cmpl'
    type: string
  cxx-compiler:
    description: "C++ compiler to use. Leave unset only if the container default is intended"
    required: false
    default: 'unkn_cpp_cmpl'
    type: string
  cxx-flags:
    description: "C++ compiler flags"
    required: false
    default: '-no-pie'
    type: string
  sanitizers:
    description: "Enable sanitizers (NoSanitizers or Sanitizers)"
    required: false
    default: 'NoSanitizers'
    type: string
  with-aws:
    description: "Build with AWS support"
    required: false
    default: 'OFF'
    type: string
  targets:
    description: "Build targets to compile"
    required: false
    default: 'src/all'
    type: string
  enable-ccache:
    description: "Use ccache. 'true' restores/saves the cache; 'false' (default) skips it and builds with -DENABLE_CCACHE=OFF"
    required: false
    default: 'false'
    type: string
  ccache-save:
    description: "When ccache is on, set to 'true' to save the updated cache back; 'false' (default) restores read-only"
    required: false
    default: 'false'
    type: string
  ccache-max-size:
    description: "Max ccache size per config (e.g. 1G, 2G, 500M)"
    required: false
    default: '1G'
    type: string
  cache-key-suffix:
    description: "Extra token mixed into the cache key; callers pass the container so glibc/musl caches don't collide"
    required: false
    default: 'default'
    type: string
  enable-deps-cache:
    description: "Cache the built third-party deps (third_party/_deps) and their build artifacts, skipping both download and compilation on a hit. 'false' (default) skips it."
    required: false
    default: 'false'
    type: string

runs:
  using: "composite"
  steps:
    - name: Check ccache cache-key-suffix
      if: ${{ inputs.enable-ccache == 'true' && inputs.ccache-save == 'true' }}
      shell: bash
      run: |
        # Refuse to write to a shared cache scope: reject an empty/whitespace suffix or the literal "default".
        suffix="${{ inputs.cache-key-suffix }}"
        if [[ -z "${suffix//[[:space:]]/}" || "$suffix" == "default" ]]; then
          echo "::error title=ccache::ccache-save is 'true' but cache-key-suffix is empty or 'default'. Pass a specific cache-key-suffix (e.g. the container image) so writes don't collide across configs."
          exit 1
        fi

    - name: Restore/save cache (ccache)
      if: ${{ inputs.enable-ccache == 'true' }}
      # - Reuse compiled objects across runners so unchanged files are not recompiled.
      # - The action restores here and saves in its GitHub Actions post-step (auto-generated): "Post Restore/save cache (ccache)".
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        # - This is the ccache key template used by every caller.
        # - Changing it or one of its inputs creates a new cache. Keep main's cache producer aligned with this key so
        #   pull requests can restore the cache warmed on main.
        key: dfly-ccache-${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-type }}-${{ inputs.c-compiler }}-${{ inputs.cxx-compiler }}-${{ inputs.sanitizers }}
        max-size: ${{ inputs.ccache-max-size }}
        save: ${{ inputs.ccache-save }}
        verbose: 1

    - name: Compute third-party deps cache key
      # - Generate one key for restore, save, and failure cleanup so those steps always use the same cache entry.
      # - Require a caller-specific suffix: third-party artifacts are incompatible across container environments.
      # - hashFiles() includes dependency definitions, dependency build settings, and patches. Add any new file that
      #   changes a dependency's fetched source or build output, or an old cache could be restored incorrectly.
      # - internal.cmake, sanitizers, and cxx-flags affect the compiler settings inherited by dependencies, so each
      #   setting combination needs its own cache entry. Hash flags to keep the key shell-safe and delimiter-stable.
      # - ccache is separate: it caches individual object files and also covers src/.
      if: inputs.enable-deps-cache == 'true'
      id: deps-cache-key
      shell: bash
      run: |
        suffix="${{ inputs.cache-key-suffix }}"
        if [[ -z "${suffix//[[:space:]]/}" || "$suffix" == "default" ]]; then
          echo "::error title=deps-cache::enable-deps-cache is 'true' but cache-key-suffix is empty or 'default'. Pass a specific cache-key-suffix (e.g. the container image) so deps caches don't collide across configs."
          exit 1
        fi
        HASH="${{ hashFiles('src/external_libs.cmake', 'CMakeLists.txt', 'src/CMakeLists.txt', 'helio/cmake/third_party.cmake', 'helio/cmake/internal.cmake', 'patches/**', 'helio/patches/**') }}"
        if [ -z "${HASH}" ]; then
          echo "::error title=deps-cache::hashFiles() matched no files - refusing to cache under a degenerate key. Check the file list in this step."
          exit 1
        fi
        # v4 adds a self-describing manifest header and hashes cxx-flags for a stable key. Keeping it in the key prevents restoring
        # pre-manifest archives, which cannot be validated safely. Update cache-reaper.yml's
        # DEPS_CACHE_FORMAT_VERSION when changing this version, so it removes superseded cache formats.
        DEPS_CACHE_FORMAT_VERSION="v4"
        CXX_FLAGS_HASH=$(printf '%s' "${{ inputs.cxx-flags }}" | sha256sum | cut -d ' ' -f1)
        echo "key=dfly-deps-${DEPS_CACHE_FORMAT_VERSION}-${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-type }}-${{ inputs.cxx-compiler }}-${{ inputs.sanitizers }}-${CXX_FLAGS_HASH}-${{ inputs.with-aws }}-${HASH}" >> "${GITHUB_OUTPUT}"

    - name: Define third-party deps cache paths
      if: inputs.enable-deps-cache == 'true'
      id: deps-cache-paths
      shell: bash
      run: |
        {
          echo 'paths<<EOF'
          echo '${{ inputs.build-dir }}/third_party'
          echo '${{ inputs.build-dir }}/_deps'
          echo '${{ inputs.build-dir }}/.ninja_log'
          echo '${{ inputs.build-dir }}/CMakeFiles/*_project-complete'
          echo 'EOF'
          echo 'manifest_path=${{ inputs.build-dir }}/.deps-cache-manifest'
        } >> "${GITHUB_OUTPUT}"

    - name: Restore cache (deps)
      # - actions/cache/restore only downloads a cache; unlike the combined cache action, it never saves automatically.
      # - The separate Save step can therefore require a successful build, while the failure step can delete this key.
      # - third_party contains the ExternalProject sources, per-step stamps and installed libs; _deps contains the
      #   FetchContent builds (e.g. abseil).
      # - .ninja_log is REQUIRED for a usable hit. Ninja only trusts a previously-built output if its build log records
      #   that Ninja built it. On a fresh (or tar-restored) tree without the log, Ninja re-runs every ExternalProject
      #   step regardless of file mtimes - and re-running the non-idempotent AWS 'patch -p1' against already-patched
      #   sources fails the build. Restoring .ninja_log makes Ninja treat the cached third_party/_deps work as done.
      # - CMakeFiles/*_project-complete are the final ExternalProject markers; caching them keeps the hit fully clean.
      # - Paths are workspace-relative because actions/cache runs inside the job's container, where host paths do not
      #   exist.
      if: inputs.enable-deps-cache == 'true'
      id: deps-cache-restore
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.deps-cache-paths.outputs.paths }}
          ${{ steps.deps-cache-paths.outputs.manifest_path }}
        key: ${{ steps.deps-cache-key.outputs.key }}

    - name: Validate restored cache (deps)
      # A cache archive can restore successfully yet contain an incomplete or inconsistent dependency tree.
      # Validate before calling CMake/Ninja. On failure discard only this job's restored paths and trigger a cold build.
      if: inputs.enable-deps-cache == 'true' && steps.deps-cache-restore.outputs.cache-hit == 'true'
      id: deps-cache-validate
      shell: bash
      run: |
        manifest_path="${GITHUB_WORKSPACE}/${{ steps.deps-cache-paths.outputs.manifest_path }}"
        pushd "${GITHUB_WORKSPACE}" >/dev/null
        shopt -s nullglob
        mapfile -t cache_paths <<< "${{ steps.deps-cache-paths.outputs.paths }}"
        expanded_cache_paths=()
        for cache_path in "${cache_paths[@]}"; do
          expanded_cache_paths+=($cache_path)
        done
        validation_status=0
        python3 "${GITHUB_WORKSPACE}/tools/deps_cache_manifest.py" validate \
          --root "${GITHUB_WORKSPACE}" --manifest "${manifest_path}" \
          "${expanded_cache_paths[@]}" || validation_status=$?
        case "${validation_status}" in
          0)
            echo "deps_cache_is_valid=true" >> "${GITHUB_OUTPUT}"
            ;;
          1)
            echo "::warning title=deps-cache::Invalid restored dependency cache; discarding local restore and rebuilding dependencies"
            echo "Discarding restored paths for cache key: ${{ steps.deps-cache-key.outputs.key }}"
            # The manifest cannot describe itself, so remove it separately from the shared cache-path list.
            rm -rf "${expanded_cache_paths[@]}" "${manifest_path}"
            echo "deps_cache_is_valid=false" >> "${GITHUB_OUTPUT}"
            ;;
          *)
            echo "::error title=deps-cache::Manifest validation failed with infrastructure error ${validation_status}"
            exit "${validation_status}"
            ;;
        esac
        popd >/dev/null

    - name: Clear invalid restored cache (deps)
      # Delete only this key on this ref. A read-only token on an untrusted PR may reject deletion;
      # that is non-fatal because validation has already removed the local restore for a cold build.
      if: inputs.enable-deps-cache == 'true' && steps.deps-cache-validate.outputs.deps_cache_is_valid == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cache_key="${{ steps.deps-cache-key.outputs.key }}"
        cache_ref="${{ github.ref }}"
        echo "Removing invalid remote dependency cache: ${cache_key} (ref: ${cache_ref})"
        if ! command -v gh >/dev/null 2>&1; then
          echo "::warning title=deps-cache::'gh' CLI not found; invalid remote cache remains until reaped"
        elif gh cache delete "${cache_key}" --repo "${{ github.repository }}" --ref "${cache_ref}"; then
          :
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          # A PR can restore an exact key from its base branch after its merge-ref lookup misses.
          cache_ref="refs/heads/${{ github.base_ref }}"
          echo "::warning title=deps-cache::Invalid key was not found on ${{ github.ref }}; trying base ref ${cache_ref}: ${cache_key}"
          if ! gh cache delete "${cache_key}" --repo "${{ github.repository }}" --ref "${cache_ref}"; then
            echo "::warning title=deps-cache::Could not delete invalid remote cache; it may require 'actions: write' permission"
          fi
        else
          echo "::warning title=deps-cache::Could not delete invalid remote cache; it may require 'actions: write' permission"
        fi

    - name: Report cache status (deps)
      # - Only exact cache keys are used (no restore-keys), so a hit means the config matches the saved artifacts.
      if: always() && inputs.enable-deps-cache == 'true'
      shell: bash
      run: |
        if [ "${{ steps.deps-cache-restore.outputs.cache-hit }}" != "true" ]; then
          STATUS="MISS - no matching cache found, full cold third-party build expected"
        elif [ "${{ steps.deps-cache-validate.outputs.deps_cache_is_valid }}" = "true" ]; then
          STATUS="VERIFIED HIT (exact key match) - manifest, third_party/_deps, and Ninja build log restored"
        else
          STATUS="INVALID HIT - restored cache failed manifest validation; rebuilding dependencies locally"
        fi
        echo "Third-party deps cache: ${STATUS}"
        echo "  primary key: ${{ steps.deps-cache-key.outputs.key }}"
        {
          echo "### Third-party deps cache"
          echo "- **${STATUS}**"
          echo "- primary key: \`${{ steps.deps-cache-key.outputs.key }}\`"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Configure CMake
      shell: bash
      run: |
        # Set sanitizer flags
        ASAN="OFF"
        USAN="OFF"
        if [ '${{ inputs.sanitizers }}' = 'Sanitizers' ]; then
          echo "Enabling ASAN/USAN"
          ASAN="ON"
          USAN="ON"
        fi

        # Build cmake command array
        CMAKE_CMD=(cmake
          -B "${GITHUB_WORKSPACE}/${{ inputs.build-dir }}"
          -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}"
          -GNinja
        )

        # Pass ccache on/off explicitly so the build never depends on the CMake default.
        if [ "${{ inputs.enable-ccache }}" = "true" ]; then
          CMAKE_CMD+=(-DENABLE_CCACHE=ON)
        else
          CMAKE_CMD+=(-DENABLE_CCACHE=OFF)
        fi

        # Add optional compiler overrides. 'unknwn_c_cmpl' / 'unkn_cpp_cmpl' are the key-only sentinel
        # defaults (see the inputs above): treat them like "unset".
        if [ -n "${{ inputs.c-compiler }}" ] && [ "${{ inputs.c-compiler }}" != "unknwn_c_cmpl" ]; then
          CMAKE_CMD+=(-DCMAKE_C_COMPILER="${{ inputs.c-compiler }}")
        fi
        if [ -n "${{ inputs.cxx-compiler }}" ] && [ "${{ inputs.cxx-compiler }}" != "unkn_cpp_cmpl" ]; then
          CMAKE_CMD+=(-DCMAKE_CXX_COMPILER="${{ inputs.cxx-compiler }}")
        fi
        if [ -n "${{ inputs.cxx-flags }}" ]; then
          CMAKE_CMD+=(-DCMAKE_CXX_FLAGS="${{ inputs.cxx-flags }}")
        fi

        # Add fixed options
        CMAKE_CMD+=(
          -DPRINT_STACKTRACES_ON_SIGNAL=ON
          -DWITH_AWS="${{ inputs.with-aws }}"
          -DWITH_GCP=OFF
          -DWITH_UNWIND=OFF
          -DWITH_GPERF=OFF
          -DWITH_ASAN="${ASAN}"
          -DWITH_USAN="${USAN}"
          -DLEGACY_GLOG=OFF
        )

        # Execute CMake
        echo "Running: ${CMAKE_CMD[@]}"
        "${CMAKE_CMD[@]}"

    - name: Build
      shell: bash
      run: |
        # - Use $GITHUB_WORKSPACE: it is the workspace path inside the container. github.workspace is the host path.
        cd "${GITHUB_WORKSPACE}/${{ inputs.build-dir }}"
        echo "Building target: ${{ inputs.targets }}"
        if [ "${{ inputs.enable-ccache }}" = "true" ]; then
          ccache -z || true   # zero stats so the summary below reflects only this build
        fi
        ninja ${{ inputs.targets }}
        if [ "${{ inputs.enable-ccache }}" = "true" ]; then
          echo "===== ccache stats (this build) ====="
          ccache -s || true
        fi

    - name: Generate cache manifest (deps)
      # actions/cache/save can only archive existing paths. Generate the manifest after the cold build,
      # before the external save action archives the dependency tree and its manifest together.
      if: success() && inputs.enable-deps-cache == 'true' && (steps.deps-cache-restore.outputs.cache-hit != 'true' || steps.deps-cache-validate.outputs.deps_cache_is_valid == 'false')
      shell: bash
      run: |
        manifest_path="${GITHUB_WORKSPACE}/${{ steps.deps-cache-paths.outputs.manifest_path }}"
        pushd "${GITHUB_WORKSPACE}" >/dev/null
        shopt -s nullglob
        mapfile -t cache_paths <<< "${{ steps.deps-cache-paths.outputs.paths }}"
        expanded_cache_paths=()
        for cache_path in "${cache_paths[@]}"; do
          expanded_cache_paths+=($cache_path)
        done
        # The manifest is excluded from this list because it cannot describe itself.
        python3 "${GITHUB_WORKSPACE}/tools/deps_cache_manifest.py" generate \
          --root "${GITHUB_WORKSPACE}" --manifest "${manifest_path}" \
          "${expanded_cache_paths[@]}"
        popd >/dev/null

    - name: Save cache (deps)
      # - Save only after configuration and build succeed. Later test failures must not discard a valid deps cache.
      # - Never save a failed or cancelled build: it may contain incomplete artifacts.
      # - Do not save after a verified cache hit. There is nothing new to upload, and saving it again would create an
      #   unnecessary copy for this run's branch or pull request. An invalid hit is rebuilt and replaces its cache.
      if: success() && inputs.enable-deps-cache == 'true' && (steps.deps-cache-restore.outputs.cache-hit != 'true' || steps.deps-cache-validate.outputs.deps_cache_is_valid == 'false')
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ steps.deps-cache-paths.outputs.paths }}
          ${{ steps.deps-cache-paths.outputs.manifest_path }}
        key: ${{ steps.deps-cache-key.outputs.key }}

    - name: Clear cache on build failure (deps)
      # - On failure of a cold build, clear the cache record so the next run rebuilds instead of reusing partial work.
      # - Leave an exact hit in place: it was a valid, previously-saved cache and this run's failure is unrelated to it.
      # - --ref limits deletion to this run's ref. Without it, a matching pull-request key could delete main's cache.
      # - Skip cleanup when key computation failed before producing a key.
      if: failure() && inputs.enable-deps-cache == 'true' && steps.deps-cache-key.outputs.key != '' && steps.deps-cache-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Build failed - clearing third-party deps cache key so the next run doesn't reuse it:"
        echo "  ${{ steps.deps-cache-key.outputs.key }} (ref: ${{ github.ref }})"
        if ! command -v gh >/dev/null 2>&1; then
          echo "::warning::'gh' CLI not found - skipping cache cleanup. Clear manually: gh cache delete '${{ steps.deps-cache-key.outputs.key }}' --ref '${{ github.ref }}'"
        elif ! gh cache delete "${{ steps.deps-cache-key.outputs.key }}" --repo "${{ github.repository }}" --ref "${{ github.ref }}"; then
          echo "::warning::Could not delete deps cache (missing 'actions: write' permission on forked PRs, or nothing saved under this key yet). Clear manually: gh cache delete '${{ steps.deps-cache-key.outputs.key }}' --ref '${{ github.ref }}'"
        fi
