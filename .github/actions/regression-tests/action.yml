name: Regression Tests
description: "Run regression tests"

inputs:
  dfly-executable:
    required: true
    type: string
  gspace-secret:
    required: false
    type: string
  run-only-on-ubuntu-latest:
    # 'true' or 'false' cause boolean
    # is not supported in composite actions
    required: true
    type: string
  build-folder-name:
    required: true
    type: string
  filter:
    required: false
    type: string
  aws-access-key-id:
    required: false
    type: string
    description: "AWS access key ID (optional if using OIDC - credentials set by workflow)"
  aws-secret-access-key:
    required: false
    type: string
    description: "AWS secret access key (optional if using OIDC - credentials set by workflow)"
  aws-role-to-assume:
    required: false
    type: string
    description: "AWS role ARN to assume before uploading JUnit XML to S3"
  aws-region:
    required: false
    type: string
    default: us-east-1
    description: "AWS region for S3 JUnit XML uploads"
  s3-bucket:
    required: false
    type: string
    description: "S3 bucket for Dragonfly snapshot tests; when empty, the S3 snapshot tests are skipped"
  junit-s3-bucket:
    required: false
    type: string
    description: "S3 bucket for JUnit XML uploads"
  azure-container:
    required: false
    type: string
    description: "Azure Blob Storage container name for snapshot tests"
  azure-storage-connection-string:
    required: false
    type: string
    description: "Azure Storage connection string"
  epoll:
    required: false
    type: string
  df-runtime-flags:
    required: false
    type: string
    description: "Runtime flags to pass to the dragonfly process via --df, e.g. 'enable_resp_io_loop_v2=true'"
  test-suites:
    required: false
    default: ""
    type: string
    description: "Comma, space, or newline-separated pytest filenames relative to tests/dragonfly"
  test-cases:
    required: false
    default: ""
    type: string
    description: "Extended regular expression matched against collected pytest node IDs"
  iterations:
    required: false
    default: "1"
    type: string
    description: "Number of times to run the selected pytest tests"
  test-timeout-minutes:
    required: false
    default: "357"
    type: string
    description: "Total test-runtime limit in minutes"

runs:
  using: "composite"
  # bring back timeouts once composite actions start supporting them
  # timeout-minutes: 20
  steps:
    - name: Sync valkey-search tests
      uses: ./.github/actions/sync-valkey-tests

    - name: Free disk space
      if: contains(runner.labels, 'self-hosted') == false
      shell: bash
      run: |
        echo "===================Before freeing up space ============================================"
        df -h
        rm -rf /hostroot/usr/share/dotnet
        rm -rf /hostroot/usr/local/share/boost
        rm -rf /hostroot/usr/local/lib/android
        rm -rf /hostroot/opt/ghc
        echo "===================After freeing up space ============================================"
        df -h

    - name: Install Python test requirements
      shell: bash
      run: ${GITHUB_WORKSPACE}/.github/scripts/install-pytest-requirements.sh

    - name: Prepare regression JUnit environment
      if: always()
      shell: bash
      run: |
        JUNIT_DIR="${GITHUB_WORKSPACE}/test-results/junit/regression"
        mkdir -p "${JUNIT_DIR}"

        KIND="iouring"
        if [[ "${{inputs.epoll}}" == 'epoll' ]]; then
          KIND="epoll"
        fi

        FILTER="${{inputs.filter}}"
        if [[ -z "${FILTER}" ]]; then
          FILTER="all"
        fi

        SAFE_FILTER=$("${GITHUB_WORKSPACE}/.github/scripts/sanitize-token.sh" "${FILTER}" all)

        UNIQUE_SUFFIX="$(date +%s%N)-${RANDOM}"
        {
          echo "REGRESSION_JUNIT_DIR=${JUNIT_DIR}"
          echo "REGRESSION_JUNIT_KIND=${KIND}"
          echo "REGRESSION_JUNIT_S3_SUFFIX=${RUNNER_OS}-${RUNNER_ARCH}-${KIND}-${FILTER}"
          echo "REGRESSION_JUNIT_ARTIFACT=junit-regression-${GITHUB_JOB}-${RUNNER_OS}-${RUNNER_ARCH}-${KIND}-${SAFE_FILTER}-${UNIQUE_SUFFIX}"
        } >> "${GITHUB_ENV}"

    - name: Run S3 snapshot tests with MinIO
      if: inputs.s3-bucket != '' && inputs.test-suites == '' && inputs.test-cases == '' && inputs.iterations == '1'
      shell: bash
      run: |
        echo "=== Running S3 snapshot tests with local MinIO ==="
        cd ${GITHUB_WORKSPACE}/tests

        export DRAGONFLY_PATH="${GITHUB_WORKSPACE}/${{inputs.build-folder-name}}/${{inputs.dfly-executable}}"

        # MinIO binary is downloaded and started by conftest.py when MINIO_S3_ENDPOINT is set
        MINIO_S3_ENDPOINT=http://localhost:9000 timeout 10m pytest -k "s3" --timeout=300 --color=yes dragonfly/snapshot_test.py --log-cli-level=INFO -v

    - name: Run PyTests
      id: main
      shell: bash
      run: |
        ls -l ${GITHUB_WORKSPACE}/
        cd ${GITHUB_WORKSPACE}/tests
        echo "Current commit is ${{github.sha}}"
        # used by PyTests
        export DRAGONFLY_PATH="${GITHUB_WORKSPACE}/${{inputs.build-folder-name}}/${{inputs.dfly-executable}}"
        export ROOT_DIR="${GITHUB_WORKSPACE}/tests/dragonfly/valkey_search"
        export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 # to crash on errors
        export FILTER="${{inputs.filter}}"
        JUNIT_DIR="${REGRESSION_JUNIT_DIR}"

        if ! [[ "${ITERATIONS_INPUT}" =~ ^[1-9][0-9]*$ ]]; then
          echo "iterations must be a positive integer, got: ${ITERATIONS_INPUT}"
          exit 2
        fi
        if ! [[ "${TEST_TIMEOUT_MINUTES_INPUT}" =~ ^[1-9][0-9]*$ ]]; then
          echo "test-timeout-minutes must be a positive integer, got: ${TEST_TIMEOUT_MINUTES_INPUT}"
          exit 2
        fi

        TEST_PATHS=()
        if [[ -n "${TEST_SUITES_INPUT}" ]]; then
          normalized_suites="${TEST_SUITES_INPUT//,/ }"
          for suite in ${normalized_suites}; do
            suite="${suite%.py}.py"
            if [[ "${suite}" != */* ]]; then
              suite="dragonfly/${suite}"
            fi
            if [[ ! -f "${suite}" ]]; then
              echo "Test suite not found: ${suite}"
              exit 2
            fi
            TEST_PATHS+=("${suite}")
          done
        else
          TEST_PATHS=(dragonfly)
        fi

        # Runtime flags forwarded to the dragonfly process via --df.
        # Globbing is disabled while splitting so values like vmodule=*=1 are preserved,
        # and the flags are collected into an array to avoid re-splitting/globbing
        # when expanded on the pytest command line.
        DF_RUNTIME_ARGS=()
        if [[ -n "${DF_RUNTIME_FLAGS_INPUT}" ]]; then
          set -f # disables filename expansion (globbing)
          for flag in ${DF_RUNTIME_FLAGS_INPUT}; do
            DF_RUNTIME_ARGS+=(--df "$flag")
          done
          set +f
        fi

        # Exclude large tests unless explicitly requested
        if [[ "$FILTER" == "large" ]]; then
          : # keep as-is, run only large tests
        elif [[ -n "$FILTER" ]]; then
          FILTER="(not large) and ($FILTER)"
        else
          FILTER="not large"
        fi

        if [[ "${REGRESSION_JUNIT_KIND}" == 'epoll' ]]; then
          FILTER="$FILTER and not exclude_epoll"
        else
          :
        fi

        SELECTED_TESTS=()
        if [[ -n "${TEST_CASES_INPUT}" ]]; then
          mapfile -t SELECTED_TESTS < <(
            pytest -m "$FILTER" --collect-only -q --color=no "${TEST_PATHS[@]}" 2>/dev/null |
              grep -E -- "${TEST_CASES_INPUT}" || true
          )
          if [[ "${#SELECTED_TESTS[@]}" -eq 0 ]]; then
            echo "No tests matched test-cases regex: ${TEST_CASES_INPUT}"
            exit 2
          fi
        else
          SELECTED_TESTS=("${TEST_PATHS[@]}")
        fi

        deadline_seconds=$((SECONDS + TEST_TIMEOUT_MINUTES_INPUT * 60))
        for iteration in $(seq 1 "${ITERATIONS_INPUT}"); do
          remaining_seconds=$((deadline_seconds - SECONDS))
          if [[ "${remaining_seconds}" -le 0 ]]; then
            code=124
            break
          fi

          echo "=== Regression test iteration ${iteration}/${ITERATIONS_INPUT} ==="
          junit_file="${JUNIT_DIR}/pytest-${REGRESSION_JUNIT_KIND}-${iteration}.xml"
          if [[ "${REGRESSION_JUNIT_KIND}" == 'epoll' ]]; then
            timeout --foreground "${remaining_seconds}s" pytest -m "$FILTER" --durations=10 \
              --timeout=300 --color=yes --json-report --json-report-file=report.json \
              --junitxml="${junit_file}" "${SELECTED_TESTS[@]}" --df force_epoll=true \
              "${DF_RUNTIME_ARGS[@]}" --log-cli-level=INFO || code=$?
          else
            timeout --foreground "${remaining_seconds}s" pytest -m "$FILTER" --durations=10 \
              --timeout=300 --color=yes --json-report --json-report-file=report.json \
              --junitxml="${junit_file}" "${SELECTED_TESTS[@]}" "${DF_RUNTIME_ARGS[@]}" \
              --log-cli-level=INFO || code=$?
          fi

          if [[ "${code:-0}" -ne 0 ]]; then
            break
          fi
        done

        # timeout returns 124 if we exceeded the timeout duration
        if [[ $code -eq 124 ]]; then
          # Add an extra new line here because when tests timeout the first line below continues from the test failure name
          echo "\n"
          echo "🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑"
          echo "🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 TESTS TIMEDOUT 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑"
          echo "🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑 🛑"
          # Copy the last log file because we timedout and pytest did not copy it over
          # the /tmp/failed/ folder
          cat /tmp/last_test_log_dir.txt | xargs -I {} mv {}/ /tmp/failed/
          exit 1
        fi

        # when a test fails in pytest it returns 1 but there are other return codes as well so we just check if the code is non zero
        if [[ $code -ne 0 ]]; then
          exit 1
        fi
      env:
        # Pass the raw runtime-flags input through the environment so the value is never
        # embedded directly in the shell script (avoids shell injection).
        DF_RUNTIME_FLAGS_INPUT: ${{ inputs.df-runtime-flags }}
        TEST_SUITES_INPUT: ${{ inputs.test-suites }}
        TEST_CASES_INPUT: ${{ inputs.test-cases }}
        ITERATIONS_INPUT: ${{ inputs.iterations }}
        TEST_TIMEOUT_MINUTES_INPUT: ${{ inputs.test-timeout-minutes }}
        # Add environment variables to enable the S3 snapshot test.
        # AWS credentials: if inputs provided, use them; otherwise rely on workflow OIDC auth
        DRAGONFLY_S3_BUCKET: ${{ inputs.s3-bucket }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id || env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key || env.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        AWS_REGION: ${{ env.AWS_REGION || 'us-east-1' }}
        # Azure credentials for snapshot tests (optional)
        DRAGONFLY_AZURE_CONTAINER: ${{ inputs.azure-container }}
        AZURE_STORAGE_CONNECTION_STRING: ${{ inputs.azure-storage-connection-string }}

    - name: Upload regression JUnit results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.REGRESSION_JUNIT_ARTIFACT }}
        path: ${{ github.workspace }}/test-results/junit/regression/**/*.xml
        if-no-files-found: ignore

    - name: Refresh AWS credentials for regression JUnit upload
      if: always() && inputs.junit-s3-bucket != '' && inputs.aws-role-to-assume != ''
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        unset-current-credentials: true

    - name: Upload regression JUnit results to S3
      if: always() && inputs.junit-s3-bucket != '' && inputs.aws-role-to-assume != ''
      shell: bash
      run: |
        "${GITHUB_WORKSPACE}/.github/scripts/upload-test-results-to-s3.sh" \
          dir junit "${REGRESSION_JUNIT_DIR}" "${{ inputs.junit-s3-bucket }}" "regression" \
          "${REGRESSION_JUNIT_S3_SUFFIX}" "regression JUnit" "*.xml"

    - name: Send notification on failure
      if: failure() && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        get_failed_tests() {
          local report_file=$1
          echo $(jq -r '.tests[] | select(.outcome == "failed") | .nodeid' "$report_file")
        }
        cd ${GITHUB_WORKSPACE}/tests
        failed_tests=""
        if [ -f report.json ]; then
          failed_tests=$(get_failed_tests report.json)
        fi

        KIND="iouring"
        if [[ "${{inputs.epoll}}" == 'epoll' ]]; then
          KIND="epoll"
        fi

        job_link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        message="Regression $KIND tests failed.\\n The commit is: ${{github.sha}}.\\n $failed_tests \\n Job Link: ${job_link}\\n"

        curl -s \
          -X POST \
          -H 'Content-Type: application/json' \
          '${{ inputs.gspace-secret }}' \
          -d '{"text": "'"${message}"'"}'
    - name: Copy binary on a self hosted runner
      if: failure() && contains(runner.labels, 'self-hosted')
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}/build
        timestamp=$(date +%Y-%m-%d_%H:%M:%S)
        mv ./dragonfly /var/crash/dragonfly_${timestamp}
