name: ubsan

# UndefinedBehaviorSanitizer run.
#
# Why a separate job (and NOT in PRs):
#   The extended UBSan checks (implicit-conversion, integer, function, vptr,
#   object-size) are noisy and currently have known findings, so running them
#   per-PR would block unrelated work. We keep them out of PR CI entirely
#   (the per-PR builder pins WITH_UBSAN_STRICT=OFF) and run them on a schedule.
#
# Architecture matrix (x86_64 + aarch64):
#   Several UBSan findings are architecture dependent -- e.g. `char` signedness
#   (signed on x86_64, unsigned on many aarch64 configs) and `long` width
#   assumptions surface implicit-integer-sign-change / truncation differently
#   per arch. Running both catches bugs that only one architecture would reveal.
#
# Two phases:
#   1. SELF-TEST (required): apply a patch that injects RunUbsanSelfTest() into
#      the real dragonfly binary, build with UBSan (-O1, strict), run it and
#      assert that EVERY enabled check actually fires. This proves the toolchain
#      + flags are live before we trust a "clean" run.
#   2. RUN (informational): revert the patch, rebuild clean, run the pytest
#      suite (minus 'large') under UBSan, collecting all findings as artifacts
#      for triage.

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC
  workflow_dispatch: # manual run, any branch
    inputs:
      enable_helio:
        description: "Enable Helio Instrumentation"
        type: boolean
        default: true
      compare:
        description: "Diff-run (Show newly-added issues vs a baseline run)"
        type: boolean
        default: true
      compare_ref:
        description: "Baseline: empty = last successful scheduled run; a git ref (sha/branch/tag) OR R<run-number> e.g. R3. Must be green + an ancestor of HEAD."
        type: string
        default: ""
      fail_on_new:
        description: "Fail the job on NEW real-UB + implicit-conversion findings vs baseline (default: informational)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ubsan:
    name: UBSan (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    # Force bash. GitHub falls back to `sh` (dash) inside this container, which
    # cannot parse the bash features used in the run steps below (declare -A,
    # [[ ]]). dash aborts with "Syntax error: \"(\" unexpected" and exit code 2.
    # bash is always present in the ubuntu-dev image.
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/romange/ubuntu-dev:24
      options: --security-opt seccomp=unconfined --sysctl "net.ipv6.conf.all.disable_ipv6=0"
      volumes:
        - /:/hostroot
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # Full history so `compare_ref` can be resolved and ancestry-checked.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          echo "=== arch ==="; uname -m
          echo "=== clang ==="; clang++ --version
          echo "=== cmake ==="; cmake --version

      # Defensive: the UBSan build is large; free host disk like the main CI does.
      # The host root is mounted at /hostroot (see the job's volumes).
      - name: Free disk space
        run: |
          echo "=== disk before ==="; df -h
          rm -rf /hostroot/usr/share/dotnet || true
          rm -rf /hostroot/usr/local/share/boost || true
          rm -rf /hostroot/usr/local/lib/android || true
          rm -rf /hostroot/opt/ghc || true
          echo "=== disk after ==="; df -h

      # Resolve inputs (all default to their listed value on the scheduled run,
      # where the inputs context is empty) and write a one-line config banner with
      # ALL fields to the top of the job summary. enable_helio also toggles the
      # UBSan ignore-list (BUILD time) so it affects both phase-1 and phase-2 builds.
      - name: Resolve run configuration
        env:
          ENABLE_HELIO: ${{ inputs.enable_helio }}
          COMPARE: ${{ inputs.compare }}
          COMPARE_REF: ${{ inputs.compare_ref }}
          FAIL_ON_NEW: ${{ inputs.fail_on_new }}
        run: |
          helio="${ENABLE_HELIO:-true}"          # empty on scheduled runs -> default ON
          compare="${COMPARE:-true}"
          ref="${COMPARE_REF:-}"
          fail_on_new="${FAIL_ON_NEW:-false}"
          if [[ "${helio}" == "false" ]]; then
            # Enable the ignore-list rule so helio is NOT instrumented.
            sed -i 's|^#[[:space:]]*src:\*/helio/\*|src:*/helio/*|' \
              tools/sanitizers/ubsan/ubsan-ignorelist.txt
            echo "helio instrumentation: DISABLED"
          else
            echo "helio instrumentation: ENABLED (default)"
          fi
          on_off() { [[ "$1" == "$2" ]] && echo OFF || echo ON; }
          {
            echo "> [!NOTE]"
            echo "> **Run configuration:** helio: **$(on_off "${helio}" false)** | compare: **$(on_off "${compare}" false)** | baseline: **${ref:-last successful scheduled run}** | fail_on_new: **$([[ "${fail_on_new}" == true ]] && echo ON || echo OFF)**"
            echo ">"
            echo "> Full manual run: \`gh workflow run ubsan.yml --ref <branch> -f enable_helio=true -f compare=true -f compare_ref=R3 -f fail_on_new=false\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Phase 1: self-test -- prove every enabled UBSan check is actually live.
      # ----------------------------------------------------------------------
      - name: Inject UBSan self-test into dragonfly
        run: |
          git apply --whitespace=nowarn tools/sanitizers/ubsan/inject_ubsan_selftest.patch
          echo "Applied inject_ubsan_selftest.patch"

      - name: Build dragonfly (UBSan, strict, -O1)
        uses: ./.github/actions/builder
        with:
          build-type: Debug
          c-compiler: clang
          cxx-compiler: clang++
          # -O1 activates object-size; -Wno-error keeps clang's unused-arg warning non-fatal.
          cxx-flags: "-O1 -Wno-error=unused-command-line-argument"
          sanitizers: Sanitizers
          with-asan: 'OFF'   # UBSan-only run: ASan would abort on the self-test's memory cases.
          ubsan-strict: 'ON'
          with-aws: 'OFF'
          targets: dragonfly

      - name: Run self-test and assert every check fires
        run: |
          cd ${GITHUB_WORKSPACE}/build
          mkdir -p ubsan-logs
          # No halt_on_error -> UBSan prints and continues, so one run exercises all cases.
          export UBSAN_OPTIONS="print_stacktrace=1:report_error_type=1:log_path=$(pwd)/ubsan-logs/selftest"
          ./dragonfly || true
          # UBSan writes to <log_path>.<pid>; gather them all.
          cat ubsan-logs/selftest.* > selftest.ubsan 2>/dev/null || true
          echo "================ self-test UBSan output ================"
          cat selftest.ubsan || true
          echo "======================================================="

          # Each enabled check must appear at least once. Substrings are matched
          # against UBSan's "runtime error:" / SUMMARY lines (report_error_type=1).
          declare -A checks=(
            ["implicit-conversion"]="implicit conversion"
            ["implicit-integer-sign-change"]="implicit-integer-sign-change"
            ["array-bounds"]="out of bounds"
            ["nullability"]="null pointer passed as argument"
            ["float-divide-by-zero"]="division by zero"
            ["signed-integer-overflow"]="signed integer overflow"
            ["unsigned-integer-overflow"]="unsigned integer overflow"
            ["shift"]="shift"
            ["function"]="incorrect function type"
            ["vptr"]="member call on address"
            ["object-size"]="object-size"
          )
          missing=0
          for name in "${!checks[@]}"; do
            if grep -qiF "${checks[$name]}" selftest.ubsan; then
              echo "  PASS  $name"
            else
              echo "  MISS  $name  (expected substring: '${checks[$name]}')"
              missing=$((missing + 1))
            fi
          done
          if [[ $missing -gt 0 ]]; then
            echo "::error::UBSan self-test: $missing expected check(s) did not fire -- toolchain/flags may be broken."
            exit 1
          fi
          echo "All expected UBSan checks fired."

          # The 12 self-test cases must each produce exactly one finding. Match on
          # the ubsan_selftest.cc source path so startup / third-party noise is
          # excluded from the count.
          selftest_count=$(grep "runtime error" selftest.ubsan | grep -c "ubsan_selftest.cc" || true)
          echo "self-test produced ${selftest_count} finding(s) in ubsan_selftest.cc (expected 12)"
          if [[ "${selftest_count}" -ne 12 ]]; then
            echo "::error::UBSan self-test expected exactly 12 findings, got ${selftest_count}"
            exit 1
          fi

      # Demonstrate the runtime options actually change behaviour (not separate
      # code -- same binary, different UBSAN_OPTIONS).
      - name: Assert runtime options take effect
        run: |
          cd ${GITHUB_WORKSPACE}/build
          # halt_on_error=1 stops at the first finding (fewer "runtime error" lines).
          all=$(UBSAN_OPTIONS="report_error_type=1" ./dragonfly 2>&1 | grep -c "runtime error" || true)
          one=$(UBSAN_OPTIONS="halt_on_error=1" ./dragonfly 2>&1 | grep -c "runtime error" || true)
          echo "findings without halt_on_error=$all, with halt_on_error=1=$one"
          if [[ "$one" -ge "$all" || "$all" -lt 2 ]]; then
            echo "::warning::halt_on_error did not reduce the number of findings as expected"
          fi
          # silence_unsigned_overflow=1 must drop the unsigned-overflow finding.
          noisy=$(UBSAN_OPTIONS="report_error_type=1" ./dragonfly 2>&1 | grep -c "unsigned integer overflow" || true)
          quiet=$(UBSAN_OPTIONS="report_error_type=1:silence_unsigned_overflow=1" ./dragonfly 2>&1 | grep -c "unsigned integer overflow" || true)
          echo "unsigned-overflow findings: noisy=$noisy silenced=$quiet"

      - name: Revert self-test injection
        run: |
          git apply -R --whitespace=nowarn tools/sanitizers/ubsan/inject_ubsan_selftest.patch
          echo "Reverted inject_ubsan_selftest.patch"

      # ----------------------------------------------------------------------
      # Phase 2: run the whole pytest suite (minus 'large') under UBSan. We do
      # NOT curate a UBSan subset -- running everything shows the real failure
      # surface. Findings and per-test timings are collected to ubsan-logs and
      # surfaced in the job summary; they do not fail the job (there are known
      # existing findings).
      # ----------------------------------------------------------------------
      - name: Finalize sanitized dragonfly (incremental, patch reverted)
        uses: ./.github/actions/builder
        with:
          build-type: Debug
          c-compiler: clang
          cxx-compiler: clang++
          cxx-flags: "-O1 -Wno-error=unused-command-line-argument"
          sanitizers: Sanitizers
          with-asan: 'OFF'   # UBSan-only run.
          ubsan-strict: 'ON'
          with-aws: 'OFF'
          # Same build dir as phase 1 -- ninja only recompiles dfly_main.cc and
          # relinks dragonfly (the self-test source is gone). No clean rebuild.
          targets: dragonfly

      - name: Install Python test requirements
        run: ${GITHUB_WORKSPACE}/.github/scripts/install-pytest-requirements.sh

      # Test pass/fail is intentionally NOT a gate here (handled separately).
      # continue-on-error lets the run proceed so we can evaluate UBSan findings.
      - name: Run tests under UBSan
        continue-on-error: true
        run: |
          set -o pipefail   # keep pytest's exit code across the tee below
          cd ${GITHUB_WORKSPACE}/tests
          mkdir -p ${GITHUB_WORKSPACE}/build/ubsan-logs
          # Bundle the triage helper into the artifact root so it runs directly
          # from the unzipped download (see the summary's INFO note).
          cp ${GITHUB_WORKSPACE}/tools/sanitizers/ubsan/ubsan_trace.sh \
            ${GITHUB_WORKSPACE}/build/ubsan-logs/
          export DRAGONFLY_PATH="${GITHUB_WORKSPACE}/build/dragonfly"
          # halt_on_error=0 keeps dragonfly alive so one run logs EVERY finding (max coverage).
          # strip_path_prefix trims the workspace path so locations read as src/... and helio/...
          # instance.py rewrites log_path to build/ubsan-logs/<suite>/<case>/ubsan, so findings
          # land in a per-test folder as short ubsan.<pid> files (no cross-test clobber).
          export UBSAN_OPTIONS="halt_on_error=0:print_stacktrace=1:report_error_type=1:strip_path_prefix=${GITHUB_WORKSPACE}/:suppressions=${GITHUB_WORKSPACE}/tools/sanitizers/ubsan/ubsan-suppressions.txt:log_path=${GITHUB_WORKSPACE}/build/ubsan-logs/ubsan"
          # Run the WHOLE suite except tests tagged 'large' (too heavy for UBSan).
          # valkey_search needs separate setup and is excluded from collection.
          # --continue-on-collection-errors: one un-importable module must not abort the
          # entire session (that previously hid all results behind a single collection error).
          # --junitxml records per-test wall time + failure reason for the timing report.
          # -rfE + tee capture the full pytest console -- tracebacks and the captured
          # stdout/stderr/logs of FAILED/ERRORED tests -- to pytest-console.log, uploaded
          # with the artifact so failures can be diagnosed without re-running.
          # Timeout is generous: the full suite under UBSan is much slower than a normal run.
          timeout 110m pytest -m "not large" \
            --ignore=dragonfly/valkey_search --timeout=600 --color=yes -rfE \
            --continue-on-collection-errors \
            --junitxml="${GITHUB_WORKSPACE}/build/ubsan-logs/ubsan-junit.xml" \
            dragonfly/ 2>&1 | tee "${GITHUB_WORKSPACE}/build/ubsan-logs/pytest-console.log"

      # Resolve the baseline for the "New vs Existing" diff and emit a selector for
      # the single download step below. Default (empty compare_ref) = the last
      # successful SCHEDULED run (lenient: skip if none yet). An explicit compare_ref --
      # a git ref OR R<run-number> -- is STRICT: it must be green (for R<n>) and an
      # ancestor of HEAD, with a real artifact, else the job fails.
      - name: Resolve findings baseline
        id: baseline
        if: ${{ inputs.compare != 'false' }}
        env:
          COMPARE_REF: ${{ inputs.compare_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # Make a commit available locally even if the checkout happens to be shallow.
          ensure_present() { git cat-file -e "$1^{commit}" 2>/dev/null || git fetch --no-tags origin "$1" 2>/dev/null || true; }
          ensure_ancestor() { git merge-base --is-ancestor "$1" HEAD 2>/dev/null || fail "$2"; }
          emit() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }  # selector for the fetch step

          ref="${COMPARE_REF:-}"
          if [[ -z "${ref}" ]]; then
            emit "fetch=true" "lenient=true" "if_missing=warn" \
                 "conclusion=success" "event=schedule" "commit=" "run_id=" \
                 "desc=the last successful scheduled run"
            exit 0
          fi

          # R<run-number> (e.g. R3): compare against that workflow run -- must be GREEN.
          if [[ "${ref}" =~ ^[Rr][0-9]+$ ]]; then
            num="${ref#[Rr]}"
            api="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/workflows/ubsan.yml/runs?per_page=100"
            row="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}" \
                   | jq -c --argjson n "${num}" 'first(.workflow_runs[] | select(.run_number==$n))')" || true
            [[ -n "${row}" && "${row}" != "null" ]] || fail "compare_ref '${ref}': no run #${num} for ubsan.yml (or beyond the latest 100 runs)."
            conclusion="$(printf '%s' "${row}" | jq -r '.conclusion')"
            sha="$(printf '%s' "${row}" | jq -r '.head_sha')"
            [[ "${conclusion}" == "success" ]] || fail "compare_ref '${ref}': run #${num} is not green (conclusion=${conclusion})."
            ensure_present "${sha}"
            ensure_ancestor "${sha}" "compare_ref '${ref}': run #${num} commit ${sha} is not an ancestor of HEAD."
            emit "fetch=true" "lenient=false" "if_missing=fail" \
                 "conclusion=" "event=" "commit=" "run_id=$(printf '%s' "${row}" | jq -r '.id')" \
                 "desc=run #${num} (${sha:0:12})"
            exit 0
          fi

          # A git ref (sha / branch / tag); also try origin/<ref>, then fetch it
          # (handles a shallow clone) before giving up.
          sha="$(git rev-parse --verify "${ref}^{commit}" 2>/dev/null)" || true
          [[ -n "${sha}" ]] || sha="$(git rev-parse --verify "origin/${ref}^{commit}" 2>/dev/null)" || true
          if [[ -z "${sha}" ]]; then
            git fetch --no-tags origin "${ref}" 2>/dev/null || true
            sha="$(git rev-parse --verify "FETCH_HEAD^{commit}" 2>/dev/null)" || true
          fi
          [[ -n "${sha}" ]] || fail "compare_ref '${ref}' is not a valid git ref (or not reachable in this checkout)."
          ensure_ancestor "${sha}" "compare_ref '${ref}' (${sha}) is not an ancestor of HEAD (must be on the current branch history)."
          emit "fetch=true" "lenient=false" "if_missing=fail" \
               "conclusion=" "event=" "commit=${sha}" "run_id=" \
               "desc=${ref} (${sha:0:12})"

      # Single baseline download. Selector fields come from the resolve step above;
      # empty ones are ignored by the action. Lenient (continue-on-error + warn) only
      # for the default last-scheduled baseline; explicit refs/runs fail on a miss.
      - name: Fetch findings baseline
        if: ${{ steps.baseline.outputs.fetch == 'true' }}
        continue-on-error: ${{ steps.baseline.outputs.lenient == 'true' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ubsan.yml
          workflow_conclusion: ${{ steps.baseline.outputs.conclusion }}
          event: ${{ steps.baseline.outputs.event }}
          commit: ${{ steps.baseline.outputs.commit }}
          run_id: ${{ steps.baseline.outputs.run_id }}
          name: ubsan-logs-${{ matrix.arch }}
          path: ${{ github.workspace }}/build/ubsan-baseline
          if_no_artifact_found: ${{ steps.baseline.outputs.if_missing }}

      - name: Publish UBSan findings to job summary
        if: always()
        run: |
          bash "${GITHUB_WORKSPACE}/tools/sanitizers/ubsan/ubsan_summarize_findings.sh" \
            "${GITHUB_WORKSPACE}/build/ubsan-logs" "${{ matrix.arch }}" \
            "${GITHUB_WORKSPACE}/build/ubsan-baseline" "${{ steps.baseline.outputs.desc }}" \
            >> "$GITHUB_STEP_SUMMARY"

      # Opt-in strict gate: fail the job on NEW findings vs the baseline. Scope is
      # real UB + implicit-conversion (the #7562 narrowing class); other suspicious
      # (unsigned wrap/negation/shift) stay informational. Off by default while we
      # stabilize the baseline -- flip it on once the diff is proven steady.
      - name: Enforce fail_on_new
        if: ${{ inputs.fail_on_new == 'true' }}
        run: |
          f="${GITHUB_WORKSPACE}/build/ubsan-logs/new-findings.txt"
          if [[ ! -s "$f" ]]; then
            echo "No new findings vs baseline (or no baseline available)."
            exit 0
          fi
          # new-findings.txt rows are BUCKET<TAB>KIND<TAB>file:line:col<TAB>example-test.
          gated="$(awk -F'\t' '$1=="UB" || $2=="implicit-conversion"' "$f")"
          n="$(printf '%s\n' "${gated}" | grep -c . || true)"
          if [[ "$n" -gt 0 ]]; then
            echo "::error::fail_on_new: ${n} new gated finding(s) vs baseline (UB + implicit-conversion)."
            printf '%s\n' "${gated}" | awk -F'\t' '{ print "  + "$2"  "$3"  (e.g. "$4")" }'
            exit 1
          fi
          echo "No new gated findings (UB / implicit-conversion) vs baseline."

      # Best-effort timing baseline: the latest successful regression-tests run
      # uploads its pytest JUnit as junit-regression-* artifacts. Pull the most
      # recent one so the report can flag tests that ran suspiciously fast under
      # UBSan (= likely bailed early). Non-fatal: if it can't be fetched, the
      # report simply omits the comparison. Swap the action if third-party
      # actions are undesirable (e.g. `gh run download` with a pattern).
      - name: Fetch regression JUnit timing baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          # TODO(temporary): while this workflow lives on a fork, pull the baseline
          # from UPSTREAM dragonflydb/dragonfly so we get a real comparison. Revert
          # to this repo's own regression-tests (delete the `repo:` + `github_token:`
          # lines) once this is merged upstream. Note: cross-repo artifact download
          # may need a PAT with actions:read on dragonflydb/dragonfly if GITHUB_TOKEN
          # is insufficient.
          repo: dragonflydb/dragonfly
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: regression-tests.yml
          workflow_conclusion: success
          branch: main
          name: junit-regression-
          name_is_regexp: true
          path: ${{ github.workspace }}/build/regression-baseline
          if_no_artifact_found: warn

      - name: Publish test timings & failures to job summary
        if: always()
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/sanitizers/ubsan/ubsan_test_report.py" \
            "${GITHUB_WORKSPACE}/build/ubsan-logs/ubsan-junit.xml" \
            "${{ matrix.arch }}" \
            "${GITHUB_WORKSPACE}/build/regression-baseline" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload UBSan logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubsan-logs-${{ matrix.arch }}
          path: ${{ github.workspace }}/build/ubsan-logs
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          job_link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "UBSan run (${{ matrix.arch }}) failed: ${job_link}"
